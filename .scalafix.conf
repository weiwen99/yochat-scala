rules = [
  ExplicitResultTypes,
  DisableSyntax,
  RemoveUnused
]

RemoveUnused.imports = true
RemoveUnused.privates = true
RemoveUnused.locals = true
RemoveUnused.patternvars = true
RemoveUnused.params = true

OrganizeImports.targetDialect = Scala3

ExplicitResultTypes.memberKind = [Def, Val, Var]
ExplicitResultTypes.memberVisibility = [Public, Protected]
ExplicitResultTypes.fetchScala3CompilerArtifactsOnVersionMismatch = true

# Main sources: same strict set as CFA. Boundaries may use // scalafix:ok with a reason.
DisableSyntax.noVars = true
DisableSyntax.noThrows = false
DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noWhileLoops = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = true
DisableSyntax.noXml = true
DisableSyntax.noDefaultArgs = false
DisableSyntax.noFinalVal = true
DisableSyntax.noFinalize = true
DisableSyntax.noValPatterns = true
DisableSyntax.noGet = true
DisableSyntax.regex = [
  {
    id = "no-unsafe-get"
    pattern = "\\.get\\b(?!\\s*\\()"
    message = "Don't use .get on Option / Try / Future. Use match / getOrElse / fold."
  }
  {
    id = "no-bare-clock"
    pattern = "(Instant|LocalDateTime|LocalDate)\\.now(?!\\s*\\(\\s*[A-Za-z])|System\\.currentTimeMillis"
    message = "Don't read wall-clock time directly. Inject java.time.Clock and use Instant.now(clock). Boundary sites: // scalafix:ok DisableSyntax.no-bare-clock."
  }
  {
    id = "no-sealed-trait"
    pattern = "\\bsealed\\s+(abstract\\s+)?trait\\b"
    message = "Prefer `enum` over `sealed trait` for sum types. If enum cannot express it, // scalafix:ok DisableSyntax.no-sealed-trait with a reason."
  }
]

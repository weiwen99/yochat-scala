version = "3.10.0"
runner.dialect = scala3
maxColumn = 144
align.preset = most
continuationIndent.defnSite = 2

project {
  excludePaths = [
    "glob:**/out/**",
    "glob:**/target/**",
    "glob:**/.metals/**"
  ]
}

rewrite.imports.groups = [
  ["java[x]*\\..*"],
  ["scala\\..*"],
  ["^(?!yochat\\.).*"],
  ["yochat\\..*"]
]

newlines.topLevelStatementBlankLines = [
  { blanks { before = 1 } }
]

rewrite.rules = [
  AvoidInfix,
  SortImports,
  RedundantBraces,
  RedundantParens,
  SortModifiers,
  PreferCurlyFors
]
